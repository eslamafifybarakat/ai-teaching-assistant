<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>مساعد التدريس الذكي | AI Teaching Assistant</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Plan lectures, run live quizzes, and track how every student is doing.">

  <!-- Crawling / indexing. The app's own routes are client-rendered, so this
       document is the only thing a crawler sees; /app/ and /present/ are kept
       out of the index by robots.txt (see scripts/generate-sitemap.mjs). -->
  <link rel="canonical" href="https://ai-teaching-assistant-hazel.vercel.app/">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="author" content="Eslam Afify">
  <meta name="application-name" content="AI Teaching Assistant">
  <meta name="keywords" content="AI teaching assistant, lecture planning, live quiz, slide generation, classroom analytics, Angular, EdTech">

  <!-- The UI ships in six languages and switches in place (no route prefix),
       so every locale resolves to this one URL — x-default is the honest
       hreflang here rather than six per-language URLs that don't exist. -->
  <link rel="alternate" hreflang="x-default" href="https://ai-teaching-assistant-hazel.vercel.app/">

  <!-- Open Graph — images are generated by scripts/generate-og-images.mjs -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AI Teaching Assistant">
  <meta property="og:title" content="مساعد التدريس الذكي | AI Teaching Assistant">
  <meta property="og:description" content="Plan lectures, run live quizzes, and track how every student is doing.">
  <meta property="og:url" content="https://ai-teaching-assistant-hazel.vercel.app/">
  <meta property="og:image" content="https://ai-teaching-assistant-hazel.vercel.app/og/home.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="AI Teaching Assistant — plan lectures, run live quizzes, track every student.">
  <meta property="og:locale" content="ar_AR">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:locale:alternate" content="zh_CN">
  <meta property="og:locale:alternate" content="ru_RU">
  <meta property="og:locale:alternate" content="ja_JP">
  <meta property="og:locale:alternate" content="hi_IN">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="مساعد التدريس الذكي | AI Teaching Assistant">
  <meta name="twitter:description" content="Plan lectures, run live quizzes, and track how every student is doing.">
  <meta name="twitter:image" content="https://ai-teaching-assistant-hazel.vercel.app/og/home.png">
  <meta name="twitter:image:alt" content="AI Teaching Assistant — plan lectures, run live quizzes, track every student.">

  <!-- Default matches --color-bg in src/styles.scss; the inline script below
       swaps it to the dark value when the stored preference is dark. Changing
       either palette value means changing it in all three places — see the
       three-way-sync note in README §16. -->
  <meta name="theme-color" content="#f6f7fb">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI Teach">
  <meta name="msapplication-TileColor" content="#3c4bc4">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="mask-icon" href="mask-icon.svg" color="#3c4bc4">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Structured data. A data block, not executable script: CSP script-src
       is not enforced against it, and scripts/generate-csp-hashes.mjs
       deliberately skips it when collecting inline-script hashes. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "AI Teaching Assistant",
    "alternateName": "مساعد التدريس الذكي",
    "url": "https://ai-teaching-assistant-hazel.vercel.app/",
    "description": "Plan lectures, run live quizzes, and track how every student is doing.",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript",
    "inLanguage": ["ar", "en", "zh", "ru", "ja", "hi"],
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Person", "name": "Eslam Afify" }
  }
  </script>

  <script>
    // No-flash theme + language bootstrap: ThemeService and I18nService both
    // read these same localStorage keys, but they only run once Angular has
    // booted — by then the first paint has already happened with the wrong
    // theme/direction. Applying the stored preference here, before any CSS
    // is parsed, is what keeps a repeat visit from flashing.
    (function () {
      try {
        var theme = localStorage.getItem('ata_theme');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#0f1120');
        }
        var lang = localStorage.getItem('ata_lang');
        if (lang) {
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        }
      } catch (e) {
        // Private mode / blocked storage — fall through to the document defaults.
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
