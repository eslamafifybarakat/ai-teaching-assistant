<div class="tabs" role="tablist">
  @for (tab of tabs(); track tab.id) {
    <button
      type="button"
      role="tab"
      class="tabs__item"
      [class.tabs__item--active]="tab.id === activeId()"
      [attr.aria-selected]="tab.id === activeId()"
      (click)="changed.emit(tab.id)">
      @if (tab.icon) { <span>{{ tab.icon }}</span> }
      {{ tab.label }}
    </button>
  }
</div>
