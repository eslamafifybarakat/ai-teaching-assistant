<button
  [type]="type()"
  class="btn"
  [class]="'btn--' + variant() + ' btn--' + size()"
  [class.btn--full]="fullWidth()"
  [class.btn--loading]="loading()"
  [disabled]="disabled() || loading()"
  (click)="onClick($event)">
  @if (loading()) {
    <span class="btn__spinner" aria-hidden="true"></span>
  }
  <span class="btn__content"><ng-content></ng-content></span>
</button>
