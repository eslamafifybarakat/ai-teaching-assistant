@if (totalPages() > 1) {
  <div class="pagination">
    <button type="button" class="pagination__btn" (click)="go(page() - 1)" [disabled]="page() === 1">‹</button>
    @for (p of pages(); track p) {
      <button type="button" class="pagination__btn" [class.pagination__btn--active]="p === page()" (click)="go(p)">{{ p }}</button>
    }
    <button type="button" class="pagination__btn" (click)="go(page() + 1)" [disabled]="page() === totalPages()">›</button>
  </div>
}
